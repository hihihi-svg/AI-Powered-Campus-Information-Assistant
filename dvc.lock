      hash: md5
      md5: cb4b5f2e73007713264a5a3ed9e71fbd
      size: 321668
  generate_embeddings:
    cmd: python -c "from src.retrieval import SemanticRetriever; r = 
      SemanticRetriever(); 
      r.load_and_index('data/processed/campus_documents.jsonl'); 
      r.encode_corpus(cache_path='data/processed/corpus_semantic_embeddings.npy')"
    deps:
    - path: data/processed/campus_documents.jsonl
      hash: md5
      md5: badee2d967dd094fa1ee5fc87583e8a5
      size: 432778
    - path: src/retrieval.py
