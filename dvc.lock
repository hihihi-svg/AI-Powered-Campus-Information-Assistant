schema: '2.0'
stages:
  normalize_placements:
    cmd: python -m src.scrapers.rvce_placements_scraper --use-cache --raw-path 
      data/raw/rvce_placements_2027.json --processed-path 
      data/processed/rvce_placements_2027.jsonl
    deps:
    - path: data/raw/rvce_placements_2027.json
      hash: md5
      md5: 52fec32b5410ef0d62a421a2540e8f91
      size: 201700
    - path: src/scrapers/rvce_placements_scraper.py
      hash: md5
      md5: cb1b2ff83b124be508f3452ebc5b3c31
      size: 16299
